<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puppy Wash — Felicity's Game</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ffe0ef,#e6d8ff,#d2f9ff);text-align:center;color:#773b77}.wrap{max-width:860px;margin:auto;padding:12px}h1{font-size:clamp(30px,6vw,52px);margin:10px}.panel{background:#ffffffcf;border:4px solid white;border-radius:30px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #b76b9b33}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button{font:inherit;font-size:clamp(16px,2.5vw,23px);font-weight:800;border:3px solid white;border-radius:19px;background:#ffb9df;color:#71336b;padding:12px 17px;cursor:pointer;box-shadow:0 4px 0 #d785b3;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:none}.pickbtn{background:#fff1fa;min-width:130px}.pickbtn svg{width:100px;height:112px;display:block;margin:auto}.dog{width:min(100%,340px);margin:0 auto;position:relative;cursor:pointer;touch-action:manipulation}.dog svg{width:100%;height:auto;display:block;overflow:visible}.hidden{display:none!important}.big{font-size:26px;font-weight:800;margin:8px}.small{font-size:14px}.rainbow{background:linear-gradient(90deg,#ffc2db,#ffe9a8,#c9f7bd,#b9eaff,#dcc2ff);border-radius:25px;padding:15px;margin-top:16px}.stars{font-size:38px;animation:float .8s infinite alternate}@keyframes float{to{transform:translateY(-8px)}}#message{min-height:38px;font-size:22px;font-weight:800}.tool-used{background:#c9f4d5}#sparkles{pointer-events:none;position:absolute;inset:15%;font-size:45px;animation:float .6s infinite alternate}
</style></head><body><div class="wrap"><h1>🐾 Puppy Wash! 💗</h1><p class="big" id="step">Pick a pup! 🐶</p><section class="panel" id="pick"><div class="choices" id="puppyChoices"></div></section><section class="panel hidden" id="play"><div class="dog" id="dog" onclick="tapDog()"><svg id="pupArt" viewBox="0 0 300 340" aria-label="A cute puppy sitting facing you" role="img"><defs><linearGradient id="furLight" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ddd"/></linearGradient></defs><ellipse cx="150" cy="320" rx="105" ry="12" fill="#ad8bba" opacity=".22"/><g id="puppyBase"><path id="tail" d="M222 238 Q285 195 266 163" fill="none" stroke="#d99d53" stroke-width="24" stroke-linecap="round"/><ellipse id="body" cx="150" cy="244" rx="84" ry="80" fill="#e9b970"/><ellipse id="tummy" cx="150" cy="247" rx="49" ry="62" fill="#fff1d7"/><ellipse id="pawL" cx="95" cy="302" rx="31" ry="22" fill="#e9b970"/><ellipse id="pawR" cx="205" cy="302" rx="31" ry="22" fill="#e9b970"/><path id="earL" d="M89 86 Q23 45 34 147 Q42 187 87 154Z" fill="#b97844"/><path id="earR" d="M211 86 Q277 45 266 147 Q258 187 213 154Z" fill="#b97844"/><ellipse id="head" cx="150" cy="124" rx="87" ry="84" fill="#e9b970"/><g id="spots"></g><ellipse cx="117" cy="128" rx="9" ry="12" fill="#3d2b36"/><ellipse cx="183" cy="128" rx="9" ry="12" fill="#3d2b36"/><circle cx="120" cy="124" r="3" fill="white"/><circle cx="186" cy="124" r="3" fill="white"/><ellipse cx="150" cy="166" rx="35" ry="26" fill="#fff5e9"/><path d="M140 155 Q150 147 160 155 Q161 165 150 168 Q139 165 140 155" fill="#54363d"/><path d="M150 168 Q143 181 134 172 M150 168 Q157 181 166 172" fill="none" stroke="#54363d" stroke-width="3" stroke-linecap="round"/><ellipse cx="93" cy="163" rx="13" ry="7" fill="#f7a5ac" opacity=".55"/><ellipse cx="207" cy="163" rx="13" ry="7" fill="#f7a5ac" opacity=".55"/></g><g id="mud" opacity="1"><ellipse cx="111" cy="228" rx="14" ry="8" fill="#9a684c" opacity=".7"/><ellipse cx="194" cy="277" rx="12" ry="9" fill="#9a684c" opacity=".7"/><ellipse cx="175" cy="87" rx="12" ry="7" fill="#9a684c" opacity=".6"/></g><g id="outfitDress" class="hidden"><path id="dressFabric" d="M108 204 Q150 220 192 204 L222 279 Q150 313 78 279Z" fill="#78b9ff" stroke="#4286d2" stroke-width="3"/><path d="M111 210 Q150 230 189 210" fill="none" stroke="#fff" stroke-width="6"/><path d="M89 275 Q150 297 211 275" fill="none" stroke="#fdf1ff" stroke-width="7" stroke-dasharray="8 9"/><circle cx="150" cy="239" r="7" fill="#ffe28a"/></g><g id="outfitBow" class="hidden" transform="translate(40 -116)"><path id="bowFabric" d="M150 197 Q102 165 113 205 Q119 223 150 209 Q181 223 187 205 Q198 165 150 197" fill="#f849a6" stroke="#c72e7e" stroke-width="3"/><circle cx="150" cy="204" r="11" fill="#ffe2f3"/></g><g id="outfitHat" class="hidden"><path d="M105 75 L118 22 Q150 7 182 22 L195 75Z" fill="#bd87ee" stroke="#8757bf" stroke-width="3"/><ellipse cx="150" cy="76" rx="70" ry="13" fill="#a16bd7"/><path d="M111 54 Q150 65 189 54" stroke="#ffdd77" stroke-width="10" fill="none"/><circle cx="150" cy="18" r="11" fill="#ff80bd"/></g></svg><div id="sparkles" class="hidden">🫧 ✨ 🫧</div></div><div id="message">Let's wash!</div><div class="choices" id="bath"><button data-tool="soap" onclick="wash('soap')">🧼 Soap</button><button data-tool="bubbles" onclick="wash('bubbles')">🫧 Bubbles</button><button data-tool="water" onclick="wash('water')">🚿 Water</button></div><div class="choices hidden" id="outfits"><button onclick="wear('Bow')">🎀 Bow</button><button onclick="wear('Hat')">👒 Hat</button><button onclick="wear('Dress')">👗 Dress</button><button onclick="party()">🌈 Party!</button></div><div id="colors" class="hidden"><p class="big">🎀 Bow color!</p><div class="choices" id="bowColors"></div><p class="big">👗 Dress color!</p><div class="choices" id="dressColors"></div></div><div id="celebrate" class="hidden rainbow"><div class="stars">🎉 🌈 🎈 🐶 🎈 🌈 🎉</div><p class="big">PUPPY PARTY!</p><div class="choices"><button onclick="reward('treat')">🦴 Treat</button><button onclick="reward('ball')">🎾 Ball</button><button onclick="restart()">🐾 Next pup!</button></div></div></section><p class="small">Made by Felicity 💕</p></div><script>
const coats=[{name:'Fluffy',fur:'#f9f7f4',ear:'#e7dfda',tummy:'#ffffff',tail:'#eee6e1'},{name:'Brown',fur:'#a96d43',ear:'#76442e',tummy:'#e9c19b',tail:'#a96d43'},{name:'Spotty',fur:'#fff9f1',ear:'#37343c',tummy:'#fff',tail:'#37343c'},{name:'Gold',fur:'#e9b970',ear:'#b97844',tummy:'#fff1d7',tail:'#d99d53'}];let current=0,done=new Set(),phase='pick',soundCtx;const el=id=>document.getElementById(id),show=(id,yes)=>el(id).classList.toggle('hidden',!yes);function sound(){try{soundCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=soundCtx.createOscillator(),g=soundCtx.createGain();o.connect(g);g.connect(soundCtx.destination);o.type='sine';o.frequency.setValueAtTime(420,soundCtx.currentTime);o.frequency.exponentialRampToValueAtTime(740,soundCtx.currentTime+.16);g.gain.setValueAtTime(.06,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+.23);o.start();o.stop(soundCtx.currentTime+.23)}catch(e){}}
function colorPup(i,root=document){const c=coats[i];for(const [id,key] of [['body','fur'],['head','fur'],['pawL','fur'],['pawR','fur'],['earL','ear'],['earR','ear'],['tummy','tummy']])root.querySelector('#'+id)?.setAttribute('fill',c[key]);root.querySelector('#tail')?.setAttribute('stroke',c.tail);root.querySelector('#spots').innerHTML=i===2?'<ellipse cx="107" cy="85" rx="19" ry="14" fill="#37343c"/><ellipse cx="200" cy="170" rx="12" ry="8" fill="#37343c"/>':''}
const choiceHolder=el('puppyChoices');coats.forEach((c,i)=>{const b=document.createElement('button');b.className='pickbtn';b.innerHTML='<span style="font-size:48px">'+['🤍','🤎','🖤','💛'][i]+'</span><br>'+c.name;b.onclick=()=>choose(i);choiceHolder.appendChild(b)});
function choose(i){current=i;done=new Set();phase='bath';colorPup(i);['outfitDress','outfitBow','outfitHat'].forEach(x=>show(x,false));el('mud').style.opacity='1';el('sparkles').textContent='🫧 ✨ 🫧';show('sparkles',false);document.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('tool-used'));el('message').textContent='Wash your pup! 🛁';el('step').textContent='Bath time! 🛁';show('pick',false);show('play',true);show('bath',true);show('outfits',false);show('colors',false);show('celebrate',false);setColor('Bow',0);setColor('Dress',2);sound()}
function wash(kind){if(phase!=='bath')return;done.add(kind);document.querySelector('[data-tool="'+kind+'"]').classList.add('tool-used');el('sparkles').textContent=kind==='water'?'💦 💦 💦':kind==='soap'?'🧼 🫧 🧼':'🫧 🫧 🫧';show('sparkles',true);sound();if(done.size===3){phase='transition';el('mud').style.opacity='0';el('message').textContent='All clean! 🎀';setTimeout(()=>{phase='dress';show('sparkles',false);el('step').textContent='Dress up! 🎀';show('bath',false);show('outfits',true);show('colors',true)},600)}else el('message').textContent='Keep washing! 💗'}
function wear(kind){if(phase!=='dress')return;show('outfit'+kind,true);el('message').textContent='So cute! 💕';sound()}
function party(){if(phase!=='dress')return;phase='party';el('step').textContent='Rainbow party! 🌈';show('outfits',false);show('colors',false);show('celebrate',true);el('message').textContent='WOOF WOOF! YIP YIP! 🐶';sound()}
function reward(k){el('message').textContent=k==='treat'?'Yum yum! 🦴':'Go fetch! 🎾';sound()}
const palette=[['💗','#f849a6'],['💜','#a46be9'],['💙','#55a7f7'],['💚','#60c99a'],['💛','#ffd24f'],['❤️','#f16a67']];
function setColor(kind,i){const path=el(kind==='Bow'?'bowFabric':'dressFabric');path.setAttribute('fill',palette[i][1]);path.setAttribute('stroke',kind==='Bow'?'#a44a82':'#5478a9');if(phase==='dress')show('outfit'+kind,true);sound()}
for(const kind of ['Bow','Dress']){const holder=el(kind==='Bow'?'bowColors':'dressColors');palette.forEach(([emoji,color],i)=>{const b=document.createElement('button');b.textContent=emoji;b.title=kind+' '+['pink','purple','blue','green','yellow','red'][i];b.setAttribute('aria-label',b.title);b.style.background=color;b.style.minWidth='53px';b.style.padding='9px';b.onclick=()=>setColor(kind,i);holder.appendChild(b)})}
function restart(){phase='pick';show('pick',true);show('play',false);el('step').textContent='Pick a pup! 🐶'}function tapDog(){if(phase==='bath')wash(['soap','bubbles','water'].find(x=>!done.has(x))||'bubbles');else sound()}
</script></body></html>
